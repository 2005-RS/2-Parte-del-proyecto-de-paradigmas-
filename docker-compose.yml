name: profelink

services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-activities:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ACTIVITIES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ACTIVITIES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_ACTIVITIES_DB}
    volumes:
      - activities_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ACTIVITIES_USER} -d ${POSTGRES_ACTIVITIES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "9464:9464"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  auth-api:
    image: ${DOCKERHUB_NAMESPACE:-profelink}/profelink-auth:${IMAGE_TAG:-1.0.0}
    build:
      context: ./apps/auth-api
      args:
        INSECURE_TLS: ${INSECURE_TLS:-false}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_AUTH_USER}:${POSTGRES_AUTH_PASSWORD}@postgres-auth:5432/${POSTGRES_AUTH_DB}
      PORT: 3001
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      KEY_DIR: /keys
      SEED: ${SEED}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: auth-api
    volumes:
      - auth_keys:/keys
    ports:
      - "${AUTH_PORT:-3001}:3001"
    depends_on:
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  activities-api:
    image: ${DOCKERHUB_NAMESPACE:-profelink}/profelink-activities:${IMAGE_TAG:-1.0.0}
    build:
      context: ./apps/activities-api
      args:
        INSECURE_TLS: ${INSECURE_TLS:-false}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_ACTIVITIES_USER}:${POSTGRES_ACTIVITIES_PASSWORD}@postgres-activities:5432/${POSTGRES_ACTIVITIES_DB}
      PORT: 3002
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      AUTH_JWKS_URL: http://auth-api:3001/.well-known/jwks.json
      SEED: ${SEED}
      MAX_PLAYERS_PER_SESSION: ${MAX_PLAYERS_PER_SESSION}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: activities-api
    volumes:
      - activity_uploads:/data/uploads
    ports:
      - "${ACTIVITIES_PORT:-3002}:3002"
    depends_on:
      postgres-activities:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  web:
    image: ${DOCKERHUB_NAMESPACE:-profelink}/profelink-web:${IMAGE_TAG:-1.0.0}
    build:
      context: ./apps/web
      args:
        INSECURE_TLS: ${INSECURE_TLS:-false}
    environment:
      AUTH_URL: ${WEB_AUTH_URL}
      ACTIVITIES_URL: ${WEB_ACTIVITIES_URL}
      WS_URL: ${WEB_WS_URL}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-api:
        condition: service_healthy
      activities-api:
        condition: service_healthy
    restart: unless-stopped

  demo-client:
    image: ${DOCKERHUB_NAMESPACE:-profelink}/profelink-demo:${IMAGE_TAG:-1.0.0}
    build: ./apps/demo-client
    environment:
      AUTH_URL: ${DEMO_AUTH_URL}
      ACTIVITIES_URL: ${DEMO_ACTIVITIES_URL}
      WEB_URL: ${WEB_URL:-http://localhost:8080}
    ports:
      - "${DEMO_PORT:-8081}:80"
    depends_on:
      - auth-api
      - activities-api
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      ACTIVITIES_DOMAIN: ${ACTIVITIES_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
      DEMO_DOMAIN: ${DEMO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth-api
      - activities-api
      - web
      - demo-client
    restart: unless-stopped

volumes:
  auth_data:
  activities_data:
  auth_keys:
  activity_uploads:
  grafana_data:
  caddy_data:
  caddy_config:
