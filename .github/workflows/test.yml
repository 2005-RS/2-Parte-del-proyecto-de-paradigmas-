name: pruebas

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Identidad
        working-directory: apps/auth-api
        run: npm ci && npm test
      - name: Actividades
        working-directory: apps/activities-api
        run: npm ci && npm test
      - name: Aula
        working-directory: apps/web
        run: npm ci && npm run build
